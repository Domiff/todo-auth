[project]
name = "todo-auth"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "aio-pika>=10.2.3",
    "alembic>=1.20.0",
    "asyncpg>=0.32.0",
    "authx>=1.7.1",
    "fastapi[standard]>=0.142.2",
    "pwdlib[argon2]>=0.3.1",
    "pyjwt[crypto]>=2.15.1",
    "redis>=8.1.0",
    "sqladmin[full]>=0.32.0",
    "sqlalchemy[asyncio]>=2.1.3",
]

[tool.fastapi]
entrypoint = "backend.main:app"
